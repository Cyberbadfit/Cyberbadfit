<svg width="1200" height="270" viewBox="0 0 1200 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Animated technology orbit</title><desc id="description">A dark three-dimensional orbit connecting the developer's technical skills.</desc>
  <defs><radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(600 135) rotate(90) scale(85)" gradientUnits="userSpaceOnUse"><stop stop-color="#67e8f9" stop-opacity=".9"/><stop offset=".42" stop-color="#38bdf8" stop-opacity=".28"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><linearGradient id="line" x1="158" y1="127" x2="1034" y2="162" gradientUnits="userSpaceOnUse"><stop stop-color="#38bdf8" stop-opacity=".18"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22c55e" stop-opacity=".18"/></linearGradient></defs>
  <rect width="1200" height="270" rx="20" fill="#0b1220"/><ellipse cx="600" cy="135" rx="430" ry="84" stroke="url(#line)" stroke-width="1.4"/><ellipse cx="600" cy="135" rx="286" ry="129" transform="rotate(-18 600 135)" stroke="#38bdf8" stroke-opacity=".17"/><circle cx="600" cy="135" r="86" fill="url(#core)"/><circle cx="600" cy="135" r="31" fill="#111e34" stroke="#67e8f9" stroke-opacity=".75"/><path d="m586 135 10 10 20-22" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="600" cy="135" r="42" stroke="#38bdf8" stroke-opacity=".24"><animate attributeName="r" values="37;46;37" dur="2.8s" repeatCount="indefinite"/></circle>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><g transform="translate(159 126)"><circle r="29" fill="#122238" stroke="#38bdf8" stroke-opacity=".7"/><text y="5" fill="#67e8f9">HTML</text></g><g transform="translate(316 193)"><circle r="29" fill="#122238" stroke="#38bdf8" stroke-opacity=".7"/><text y="5" fill="#67e8f9">CSS</text></g><g transform="translate(454 67)"><circle r="29" fill="#211d3e" stroke="#a78bfa" stroke-opacity=".7"/><text y="5" fill="#c4b5fd">JS</text></g><g transform="translate(761 56)"><circle r="29" fill="#122238" stroke="#38bdf8" stroke-opacity=".7"/><text y="5" fill="#67e8f9">REACT</text></g><g transform="translate(912 193)"><circle r="29" fill="#132d29" stroke="#22c55e" stroke-opacity=".7"/><text y="5" fill="#86efac">NODE</text></g><g transform="translate(1036 121)"><circle r="29" fill="#211d3e" stroke="#a78bfa" stroke-opacity=".7"/><text y="5" fill="#c4b5fd">C / C++</text></g><g transform="translate(746 221)"><circle r="29" fill="#132d29" stroke="#22c55e" stroke-opacity=".7"/><text y="5" fill="#86efac">DATA</text></g></g>
